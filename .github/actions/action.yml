# @tear: 1
name: tears
description: "Tiered Enforcement, Authorship Review System — scan a repo for tier violations."

inputs:
  path:
    description: "Path to scan (defaults to repo root)."
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install tears
      shell: bash
      run: python -m pip install tears-cli

    - name: Run tears
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
      run: tears "$SCAN_PATH"