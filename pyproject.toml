# @tear: 1
[project]
name = "tears-cli"
version = "0.2.0"
description = "Tiered Enforcement, Authorship Review System — vibe-code responsibly."
license = { file = "LICENSE" }
authors = [
    { name = "Hillel Twersky", email = "35217356+Thillel@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "grimp>=3.4",
]

[project.scripts]
tears = "tears.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
    "pyright>=1.1.380",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/scan/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/scan/fixtures"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tears"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
